name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (Pint, PHPStan, Rector, Pest, auditoría)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: travelapp_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: travelapp_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, bcmath, sodium, zip, gd, pdo_mysql
          coverage: pcov

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Caché de Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: composer lint:check
      - run: composer analyse
      - run: composer refactor:check
      - run: composer test:coverage
      - run: composer audit
